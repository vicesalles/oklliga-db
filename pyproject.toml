[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oklliga"
version = "0.1.0"
description = "Connector Python per a la base de dades de l'OK Lliga (mineria de dades)"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["oklliga*"]
